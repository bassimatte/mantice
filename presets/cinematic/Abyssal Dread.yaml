meta:
  name: Abyssal Dread
  slug: abyssal_dread
  category: cinematic
  mood:
  - dark
  - ominous
  - unsettling
  - tense
  description: 'Dissonant, pitch-black drone. Detuned clusters and aggressive FM create
    a sense of creeping dread. No warmth, no comfort.

    '
  author: Matteo Bassi
  engine_version: MANTICE_V8
  tags:
  - dark
  - cinematic
