meta:
  name: Event Horizon
  slug: event_horizon
  category: cinematic
  mood:
  - cinematic
  - epic
  - massive
  - building
  description: 'A dense, multi-layered cinematic drone that evokes the edge of a black hole. Many voices, wide stereo, spiralling
    trajectories, and a massive reverb tail.

    '
  author: Matteo Bassi
  engine_version: MANTICE_V8
  tags:
  - dark
  - cinematic
  - deep
global:
  duration_seconds: 60
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: infinite
  mix: 0.3
  decay_trim: 0.8
spatial:
  depth: 3.0
  wetness: 0.0
  swarm_density: 0.7
earth:
  enabled: true
  tectonic_frequency: 14
  pressure: 0.45
  movement: 0.015
air:
  enabled: true
  intensity: 0.18
  movement: 0.006
  turbulence: 0.07
layers:
- name: Gravitational Bass
  enabled: true
  synthesis:
    root: 32
    voices: 20
    ratios:
    - 0.5
    - 1.0
    - 1.5
    - 2.0
  fm:
    ratios:
    - 1.0
    - 2.0
    index: 0.15
  dynamics:
    amp_min: 0.0095
    amp_max: 0.0417
    drift: 0.012
    volume_db: 0.8
  spatial_motion:
    quadrant: rear_left
    speed: 0.002
