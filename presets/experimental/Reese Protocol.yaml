meta:
  name: Reese Protocol
  slug: reese_protocol
  category: experimental
  mood:
  - dark
  - hypnotic
  - industrial
  description: Classic Reese bass drones with LP filter sweeps and a sub-oscillator floor
  author: Matteo Bassi
  engine_version: MANTICE_V21
  tags:
  - reese
  - subtractive
  - bass
  - filter
  - dark
