meta:
  name: Resonant Cave
  slug: resonant_cave
  category: experimental
  mood:
  - dark
  - metallic
  - deep
  description: High-Q comb filter on a dense FM drone  metallic cave walls singing
    back at you. A square-wave sub floor and stretched water granular create depth
    beyond the mix.
  author: Matteo Bassi
  engine_version: MANTICE_V22
  tags:
  - comb-filter
  - square-wave
  - granular
  - stretch-mode
  - binaural
