# Local reference for the proposed Massive generator mood.
# Shared root, bass and seed across A/B/C; audition before building generation rules.
meta:
  name: Massive C - Space
  slug: massive_c_space
  category: experimental
  mood: [massive, ambient, space]
  description: "An enveloping G drone: a persistent low foundation beneath broad open-fifth bands, glacial drift and a long diffuse hall."
  author: Matteo Bassi
  tags: [ambient, drone, massive, deep, space]
global: {duration_seconds: 60, sample_rate: 48000, bit_depth: 24-bit}
seed: 1701
saturation: 0.12
spatial: {depth: 2.0, wetness: 0.48, swarm_density: 0.45}
