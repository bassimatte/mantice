meta:
  name: Cavern of Echoes
  slug: cavern_of_echoes
  category: experimental
  mood:
  - cavernous
  - ancient
  - sparse
  - immersive
  description: 'A sparse, minimal drone designed to showcase the FDN reverb. Few voices
    with wide intervals leave space for the reverb tail to bloom into a vast underground
    cavern.

    '
  author: Matteo Bassi
  engine_version: FDN_REVERB_V1
  tags:
  - nature
  - atmospheric
global:
  duration_seconds: 60
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: cave
  mix: 0.4
  decay_trim: 1.0
spatial:
  depth: 1.5
  wetness: 0.0
  swarm_density: 0.3
earth:
  enabled: true
  tectonic_frequency: 16
  pressure: 0.25
  movement: 0.008
air:
  enabled: false
layers:
- name: Deep Pulse
  enabled: true
  synthesis:
    root: 55
    voices: 6
    ratios:
    - 1.0
    - 2.0
    - 3.0
  fm:
    ratios:
    - 1.0
    - 2.5
    index: 0.15
  dynamics:
    mix: 1.0
    amp_min: 0.02
    amp_max: 0.06
    drift: 0.015
  spatial_motion:
    quadrant: center
    speed: 0.004
    trajectory_x: pendulum
    trajectory_y: none
- name: Crystal Overtones
  enabled: true
  synthesis:
    root: 440
    voices: 4
    ratios:
    - 1.0
    - 1.5
    - 2.0
    - 3.0
  fm:
    ratios:
    - 3.0
    - 5.0
    index: 0.4
  dynamics:
    mix: 0.35
    amp_min: 0.005
    amp_max: 0.015
    drift: 0.005
  spatial_motion:
    quadrant: front_right
    speed: 0.008
    trajectory_x: orbit
    trajectory_y: depth
- name: Whisper Drone
  enabled: true
  synthesis:
    root: 110
    voices: 10
    ratios:
    - 0.5
    - 1.0
    - 1.5
  fm:
    ratios:
    - 1.0
    index: 0.05
  dynamics:
    mix: 0.6
    amp_min: 0.003
    amp_max: 0.02
    drift: 0.012
  spatial_motion:
    quadrant: rear_left
    speed: 0.002
    trajectory_x: drift
    trajectory_y: depth
notes:
  goal: 'Demonstrate the FDN reverb. The sparse voicing leaves gaps that the reverb
    tail fills with diffuse, evolving space. Best on headphones.

    '
  listening_tip: 'Listen for the decay tail after each drift cycle — the reverb should
    bloom outward and darken naturally over several seconds.

    '
