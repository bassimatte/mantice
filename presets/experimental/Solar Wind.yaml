meta:
  name: Solar Wind
  slug: solar_wind
  category: experimental
  mood:
  - chaotic
  - dense
  - unpredictable
  - textural
  description: 'Maximum density chaos drone. 100+ voices with extreme drift and high
    turbulence air create a wall of unpredictable texture — like standing in a solar
    storm.

    '
  author: Matteo Bassi
  engine_version: MANTICE_V8
  tags:
  - bright
  - cinematic
global:
  duration_seconds: 60
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: infinite
  mix: 0.2
  decay_trim: 0.6
spatial:
  depth: 2.5
  wetness: 0.0
  swarm_density: 0.9
earth:
  enabled: true
  tectonic_frequency: 15
  pressure: 0.35
  movement: 0.04
air:
  enabled: true
  intensity: 0.35
  movement: 0.015
  turbulence: 0.14
layers:
- name: Particle Storm Low
  enabled: true
  synthesis:
    root: 55
    voices: 20
    ratios:
    - 1.0
    - 1.17
    - 1.61
    - 2.41
  fm:
    ratios:
    - 1.0
    - 1.83
    - 3.14
    index: 0.7
  dynamics:
    mix: 1.0
    amp_min: 0.009
    amp_max: 0.0451
    drift: 0.06
  spatial_motion:
    quadrant: rear_left
    speed: 0.005
    trajectory_x: spiral
    trajectory_y: depth
- name: Ion Stream Mid
  enabled: true
  synthesis:
    root: 300
    voices: 20
    ratios:
    - 1.0
    - 1.33
    - 1.87
    - 2.72
  fm:
    ratios:
    - 2.0
    - 3.7
    index: 0.9
  dynamics:
    mix: 0.7
    amp_min: 0.006
    amp_max: 0.036
    drift: 0.07
  spatial_motion:
    quadrant: front_right
    speed: 0.008
    trajectory_x: orbit
    trajectory_y: none
- name: Radiation Scatter
  enabled: true
  synthesis:
    root: 1500
    voices: 20
    ratios:
    - 1.0
    - 1.41
    - 2.23
    - 3.61
  fm:
    ratios:
    - 4.0
    - 6.5
    index: 1.2
  dynamics:
