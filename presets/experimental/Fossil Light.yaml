meta:
  name: Fossil Light
  slug: fossil_light
  category: experimental
  mood:
  - meditative
  - organic
  - evolving
  description: >
    A slow-burning granular meditation. Bowl and glass grains orbit different
    positions while the filter and FM undertow drift on long, unpredictable
    arcs — every playback unique, always smooth.
  author: Mantice
  engine_version: MANTICE_V26
  tags:
  - granular
  - experimental
  - random_walk
  - meditative
global:
  duration_seconds: 120
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: cathedral
  mix: 0.55
  decay_trim: 1.4
spatial:
  depth: 2.0
  wetness: 0.6
  swarm_density: 0.4
earth:
  enabled: false
air:
  enabled: true
saturation: 0.1

automation:
  reverb_mix:
    enabled: true
    mode: random_walk
    center: 0.55
    depth: 0.2
    speed: slow
  binaural_beat_hz:
    enabled: true
    mode: random_walk
    center: 5.0
    depth: 3.5
    speed: slow

layers:
- name: Ancient Bowl
  enabled: true
  type: granular
  source: singing_bowl.ogg
  grain_size: 180
  density: 9
  pitch_spread: 0.3
  position: 0.25
  scatter: 0.5
  envelope: hann
  dynamics:
    amp_min: 0.005
    amp_max: 0.038
    drift: 0.003
    volume_db: 0.0
  spatial_motion:
    quadrant: front_left
    speed: 0.01
    trajectory_x: drift
  elevation: 10
  elevation_motion: float
  elevation_speed: 0.03
  elevation_range: 25
  chorus_mix: 0.25
  chorus_rate: 0.3
  chorus_depth: 0.007
  chorus_voices: 2
  automation:
    granular_position:
      enabled: true
      mode: random_walk
      center: 0.25
      depth: 0.22
      speed: slow
    filter_cutoff:
      enabled: true
      mode: random_walk
      center: 1100
      depth: 700
      speed: med

- name: Glass Memory
  enabled: true
  type: granular
  source: bowed_glass.ogg
  grain_size: 200
  density: 6
  pitch_spread: 0.7
  position: 0.6
  scatter: 0.35
  envelope: hann
  dynamics:
    amp_min: 0.003
    amp_max: 0.025
    drift: 0.004
    volume_db: -4.0
  spatial_motion:
    quadrant: front_right
    speed: 0.014
    trajectory_x: orbit
  elevation: 35
  elevation_motion: breathe
  elevation_speed: 0.05
  elevation_range: 28
  chorus_mix: 0.35
  chorus_rate: 0.5
  chorus_depth: 0.01
  chorus_voices: 3
  automation:
    granular_position:
      enabled: true
      mode: random_walk
      center: 0.6
      depth: 0.3
      speed: med
    chorus_rate:
      enabled: true
      mode: random_walk
      center: 0.5
      depth: 0.38
      speed: slow

- name: Undertow
  enabled: true
  type: fm
  synthesis:
    root: 55
    voices: 5
    ratios:
    - 1.0
    - 2.0
    - 3.0
  fm:
    ratios:
    - 1.0
    index: 0.6
  dynamics:
    amp_min: 0.003
    amp_max: 0.02
    drift: 0.002
    volume_db: -8.0
  harmonics: 3
  harmonic_decay: 0.65
  noise_amount: 0.0
  noise_color: pink
  spatial_motion:
    quadrant: center
    speed: 0.006
    trajectory_x: none
  elevation: -20
  elevation_motion: static
  elevation_speed: 0.1
  elevation_range: 60
  chorus_mix: 0.0
  chorus_rate: 0.4
  chorus_depth: 0.005
  chorus_voices: 2
  automation:
    fm_index:
      enabled: true
      mode: random_walk
      center: 0.6
      depth: 0.5
      speed: fast
