meta:
  name: Magnetic Sweep
  slug: magnetic_sweep
  category: experimental
  mood:
  - dark
  - evolving
  - hypnotic
  description: A subtractive saw bass slowly swept by an LP filter LFO  the audio
    equivalent of a magnetic field bending around a planet. Layer a comb filter on
    the mid drone for metallic resonance.
  author: Matteo Bassi
  engine_version: MANTICE_V22
  tags:
  - subtractive
  - lp-filter
  - filter-lfo
  - comb-filter
  - flanger
