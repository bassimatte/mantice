meta:
  name: Wandering Tide
  slug: wandering_tide
  category: experimental
  mood:
  - ambient
  - organic
  - evolving
  description: >
    All key parameters use random walk automation — the sound drifts continuously and
    never quite repeats. Ideal for long unattended renders.
  author: Mantice
  engine_version: MANTICE_V26
  tags:
  - granular
  - experimental
  - random_walk
  - long-form
global:
  duration_seconds: 120
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: cathedral
  mix: 0.4
  decay_trim: 1.0
spatial:
  depth: 1.8
  wetness: 0.5
  swarm_density: 0.5
earth:
  enabled: false
air:
  enabled: true
saturation: 0.15

automation:
  reverb_mix:
    enabled: true
    mode: random_walk
    center: 0.4
    depth: 0.25
    speed: slow
  shimmer_wet:
    enabled: true
    mode: random_walk
    center: 0.2
    depth: 0.15
    speed: med
  binaural_beat_hz:
    enabled: true
    mode: random_walk
    center: 6.5
    depth: 4.0
    speed: slow

layers:
- name: Shifting Sands
  enabled: true
  type: granular
  source: singing_bowl.ogg
  grain_size: 120
  density: 10
  pitch_spread: 0.4
  position: 0.35
  scatter: 0.6
  envelope: hann
  dynamics:
    amp_min: 0.005
    amp_max: 0.04
    drift: 0.003
    volume_db: 0.0
  spatial_motion:
    quadrant: front_left
    speed: 0.015
    trajectory_x: drift
  elevation: 15
  elevation_motion: float
  elevation_speed: 0.04
  elevation_range: 35
  chorus_mix: 0.3
  chorus_rate: 0.4
  chorus_depth: 0.008
  chorus_voices: 2
  automation:
    filter_cutoff:
      enabled: true
      mode: random_walk
      center: 1400
      depth: 900
      speed: med
    granular_position:
      enabled: true
      mode: random_walk
      center: 0.4
      depth: 0.35
      speed: slow

- name: Glass Drift
  enabled: true
  type: granular
  source: bowed_glass.ogg
  grain_size: 160
  density: 7
  pitch_spread: 0.8
  position: 0.5
  scatter: 0.4
  envelope: hann
  dynamics:
    amp_min: 0.003
    amp_max: 0.028
    drift: 0.004
    volume_db: -3.0
  spatial_motion:
    quadrant: front_right
    speed: 0.02
    trajectory_x: orbit
  elevation: 40
  elevation_motion: breathe
  elevation_speed: 0.06
  elevation_range: 30
  chorus_mix: 0.4
  chorus_rate: 0.5
  chorus_depth: 0.009
  chorus_voices: 3
  automation:
    chorus_rate:
      enabled: true
      mode: random_walk
      center: 0.5
      depth: 0.4
      speed: med
    granular_position:
      enabled: true
      mode: random_walk
      center: 0.5
      depth: 0.4
      speed: med

- name: FM Undertow
  enabled: true
  type: fm
  synthesis:
    root: 55
    voices: 6
    ratios:
    - 1.0
    - 2.0
  fm:
    ratios:
    - 1.0
    index: 0.8
  dynamics:
    amp_min: 0.002
    amp_max: 0.018
    drift: 0.002
    volume_db: -6.0
  harmonics: 3
  harmonic_decay: 0.7
  noise_amount: 0.0
  noise_color: pink
  spatial_motion:
    quadrant: center
    speed: 0.008
    trajectory_x: none
  elevation: -25
  elevation_motion: static
  elevation_speed: 0.1
  elevation_range: 60
  chorus_mix: 0.0
  chorus_rate: 0.5
  chorus_depth: 0.005
  chorus_voices: 2
  automation:
    fm_index:
      enabled: true
      mode: random_walk
      center: 0.8
      depth: 0.7
      speed: fast
