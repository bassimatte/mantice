meta:
  name: Breath of the Forest
  slug: breath_of_the_forest
  category: experimental
  mood:
  - organic
  - alive
  - calming
  description: An organic soundscape of wind through trees, earth tones, and rustling canopy. Living, breathing forest acoustics.
  author: Matteo Bassi
  engine_version: MANTICE_V15
  tags:
  - nature
  - organic
  - wind
  - experimental
global:
  duration_seconds: 60
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: hall
  mix: 0.3
  decay_trim: 1.0
spatial:
  depth: 2.5
  wetness: 0.0
  swarm_density: 0.4
