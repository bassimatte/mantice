meta:
  name: Primordial Forest
  slug: primordial_forest
  category: ritual
  mood:
  - organic
  - natural
  - earthy
  - alive
  description: 'An organic, nature-inspired drone. Heavy air pressure and gentle drift
    evoke a living forest canopy. Warm, breathing, grounded.

    '
  author: Matteo Bassi
  engine_version: MANTICE_V8
  tags:
  - nature
  - atmospheric
