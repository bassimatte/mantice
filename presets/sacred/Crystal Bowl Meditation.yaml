meta:
  name: Crystal Bowl Meditation
  slug: crystal_bowl_meditation
  category: sacred
  mood:
  - meditative
  - ethereal
  - healing
  description: Dense cloud of singing bowl grains at varying pitches, creating an
    endless shimmering meditation space. Like sitting inside a bowl that never stops
    ringing.
  author: Matteo Bassi
  engine_version: MANTICE_V17
  tags:
  - granular
  - sacred
  - meditation
  - singing bowl
global:
  duration_seconds: 120
  sample_rate: 44100
  bit_depth: 16-bit
reverb:
  enabled: true
  space: cathedral
  mix: 0.5
  decay_trim: 1.3
spatial:
  depth: 2.5
  wetness: 0.5
  swarm_density: 0.4
earth:
  enabled: false
air:
  enabled: false
saturation: 0.15
layers:
- name: Bowl Close
  enabled: true
  type: granular
  source: singing_bowl.ogg
  grain_size: 120
  density: 18
  pitch_spread: 0.2
  position: 0.3
  scatter: 0.4
  envelope: hann
  dynamics:
    mix: 1.0
    amp_min: 0.005
    amp_max: 0.0398
    drift: 0.003
  spatial_motion:
    quadrant: front_left
    speed: 0.02
    trajectory_x: orbit
  elevation: 0
  elevation_motion: breathe
  elevation_speed: 0.04
  elevation_range: 30
  chorus_mix: 0.3
  chorus_rate: 0.4
  chorus_depth: 0.007
  chorus_voices: 2
- name: Bowl High
  enabled: true
  type: granular
  source: singing_bowl.ogg
  grain_size: 50
  density: 25
  pitch_spread: 1.2
  position: 0.6
  scatter: 0.8
  envelope: hann
  dynamics:
    mix: 0.6
    amp_min: 0.0025
    amp_max: 0.0249
    drift: 0.004
  spatial_motion:
    quadrant: front_right
    speed: 0.035
    trajectory_x: drift
  elevation: 50
  elevation_motion: float
  elevation_speed: 0.07
  elevation_range: 40
  chorus_mix: 0.5
  chorus_rate: 0.7
  chorus_depth: 0.01
  chorus_voices: 3
- name: Bowl Deep
  enabled: true
  type: granular
  source: singing_bowl.ogg
  grain_size: 180
  density: 8
  pitch_spread: 0.5
  position: 0.1
  scatter: 0.3
  envelope: hann
  dynamics:
    mix: 0.8
    amp_min: 0.004
    amp_max: 0.0299
    drift: 0.002
  spatial_motion:
    quadrant: center
    speed: 0.01
    trajectory_x: none
  elevation: -30
  elevation_motion: static
  elevation_speed: 0.1
  elevation_range: 60
  chorus_mix: 0.2
  chorus_rate: 0.3
  chorus_depth: 0.005
  chorus_voices: 2
notes:
  goal: An immersive singing bowl soundbath using only granular grains at three octave
    ranges, creating depth from close to celestial.
  listening_tip: Use headphones. Close your eyes and let the bowl tones surround you.
