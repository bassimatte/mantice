name: Release integrity

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install system audio dependency
        run: sudo apt-get update && sudo apt-get install --yes libsndfile1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-server.txt

      - name: Run release gates
        run: python release_check.py --audio quick
